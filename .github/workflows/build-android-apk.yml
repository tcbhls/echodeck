name: Build EchoDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK 36 Ready
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies and build web bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-signing.p12"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            ./gradlew testDebugUnitTest assembleRelease --no-daemon
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
            rm -f "$ANDROID_KEYSTORE_PATH"
            echo "BUILT_APK=frontend/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; building unsigned/debug APK for community fork."
            ./gradlew testDebugUnitTest assembleDebug --no-daemon
            echo "BUILT_APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp "$BUILT_APK" release/EchoDeck-v10.5-android.apk
          ls -lh release/EchoDeck-v10.5-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoDeck-Android-APK-v10.5
          path: release/EchoDeck-v10.5-android.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v10.5.0"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -f "$TAG"
          git push -f origin "$TAG"
          gh release create "$TAG" release/EchoDeck-v10.5-android.apk \
            --title "EchoDeck v10.5 — Open-Source Standalone Language Studio" \
            --notes "EchoDeck（回声舱）v10.5 开源正式版：100% 独立离线优先 Android / PWA 语言学习应用（零后台服务器、零隐私采集、开箱免费可用）。核心亮点：1) FSRS-4.5 智能间隔复习舱 + 误评分 8 秒一键撤回 + 全语种筛选；2) 内置 50,327 词英/粤离线词典 + 60fps 检索 + 磨耳朵连播；3) 沉浸式影听精听工作台（M3U8 去广告、纯英/盲听字幕帘、AI 对齐校准、一键挖卡）；4) 多对话页 ReAct 智能 AI 助教 + 长期学习记忆，开箱内置免 Key 公共免费 AI 与 Android 原生 ARM64 llama.cpp 离线大模型（Qwen3-8B/4B/1.7B/0.6B），并支持在设置页一键配置自己的免费智谱 / DeepSeek / OpenAI API Key；5) 16 款多引擎真人 AI 语音试听馆。"
